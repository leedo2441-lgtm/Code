<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>미적분 시각화 연구실</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#121c2c;--line:#293850;--muted:#91a0b8;--text:#eef3ff;--blue:#76a9ff;--cyan:#63e0d1;--orange:#ffb86b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#1b3153,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,"Noto Sans KR",sans-serif;line-height:1.55}header,main,footer{max-width:1160px;margin:auto;padding-left:22px;padding-right:22px}header{padding-top:42px;padding-bottom:25px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.18em;font-weight:800}h1{font-size:clamp(30px,5vw,54px);letter-spacing:-.05em;line-height:1.1;margin:12px 0}header p{color:var(--muted);max-width:650px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}button,select{font:inherit;border:1px solid var(--line);background:#121b2b;color:var(--text);border-radius:12px;padding:10px 15px;cursor:pointer}button.active{background:#1d3b68;border-color:#548de2}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.9fr);gap:16px}.panel{background:linear-gradient(145deg,#131d2d,#0f1725);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 16px 45px #0002}.panel h2{font-size:17px;margin:0 0 12px}.graph-wrap{background:#0b1220;border:1px solid #243149;border-radius:14px;overflow:hidden}svg{display:block;width:100%;height:auto}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:15px}.controls label{font-size:13px;color:var(--muted)}input[type=range]{accent-color:var(--blue);width:min(240px,55vw)}select{padding:9px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.metric{background:#0d1625;border:1px solid #243149;border-radius:13px;padding:12px}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:19px;color:var(--cyan);font-variant-numeric:tabular-nums}.explain{color:#c4cee0;font-size:14px}.formula{font-family:ui-monospace,monospace;color:#a9c9ff;background:#0b1423;border:1px solid #253652;border-radius:10px;padding:11px;overflow:auto}.steps{display:grid;gap:8px;margin-top:12px}.step{padding:10px 12px;border-left:2px solid var(--blue);background:#101a2a;border-radius:0 10px 10px 0;font-size:13px;color:#c4cee0}footer{padding-top:24px;padding-bottom:35px;color:#71819a;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}header{padding-top:30px}.panel{padding:14px}}
</style></head><body>
<header><div class="eyebrow">VISUAL MATHEMATICS LAB · 01</div><h1>미적분 시각화 연구실</h1><p>공식을 외우기 전에 그래프를 움직여 보자. 점을 옮기고, 기울기를 바꾸고, 넓이가 쌓이는 모습을 직접 확인할 수 있어.</p></header>
<main><nav class="tabs"><button class="active" data-mode="limit">극한</button><button data-mode="diff">미분</button><button data-mode="int">적분</button></nav>
<div class="layout"><section class="panel"><h2 id="graphTitle">가까워지는 값 관찰하기</h2><div class="graph-wrap"><svg id="plot" viewBox="0 0 720 430" role="img" aria-label="함수 그래프 시각화"></svg></div>
<div class="controls"><label for="func">함수</label><select id="func"><option value="square">f(x) = x²</option><option value="cube">f(x) = x³</option><option value="sin">f(x) = sin(x)</option><option value="abs">f(x) = |x|</option></select><label for="xval" id="sliderLabel">x = 1.00</label><input id="xval" type="range" min="-2.5" max="2.5" step=".01" value="1"></div>
<div class="controls" id="extraControls" style="display:none"><label for="nval">구간 분할</label><input id="nval" type="range" min="4" max="60" step="1" value="12"><span id="nlabel" class="explain">12개</span></div><div class="metrics" id="metrics"></div></section>
<aside class="panel"><h2 id="sideTitle">극한은 무엇일까?</h2><div id="explain" class="explain"></div><div class="steps" id="steps"></div></aside></div></main>
<footer>그래프는 개념 이해를 위한 수치 근사 시각화야. 계산 결과는 표시된 소수 자릿수에서 반올림돼.</footer>
<script>
const $=s=>document.querySelector(s),svg=$('#plot');let mode='limit';
const funcs={square:{f:x=>x*x,d:x=>2*x},cube:{f:x=>x*x*x,d:x=>3*x*x},sin:{f:x=>Math.sin(x),d:x=>Math.cos(x)},abs:{f:x=>Math.abs(x),d:x=>x===0?NaN:Math.sign(x)}};
const W=720,H=430,L=58,R=22,T=24,B=48,X=5.4,Y=5.2,sx=x=>L+(x+X/2)/X*(W-L-R),sy=y=>T+(Y/2-y)/Y*(H-T-B);
const fmt=n=>Number.isFinite(n)?(Math.abs(n)<.0005?'0':n.toFixed(3)):'정의되지 않음';
function pathFor(f){let d='';for(let i=0;i<=500;i++){let x=-X/2+i*X/500,y=f(x);d+=(i?'L':'M')+sx(x).toFixed(2)+','+sy(y).toFixed(2)}return d}
function line(x1,y1,x2,y2,color,width,dash){return '<line x1="'+sx(x1)+'" y1="'+sy(y1)+'" x2="'+sx(x2)+'" y2="'+sy(y2)+'" stroke="'+color+'" stroke-width="'+width+'" '+(dash?'stroke-dasharray="'+dash+'"':'')+'/>'}
function riemann(f,a,b,n){let dx=(b-a)/n,sum=0;for(let i=0;i<n;i++)sum+=f(a+i*dx)*dx;return sum}
function draw(){let f=funcs[$('#func').value],x=+$('#xval').value,y=f.f(x),d=f.d(x),n=+$('#nval').value,s='';
for(let gx=-2;gx<=2;gx++){s+='<line x1="'+sx(gx)+'" y1="'+T+'" x2="'+sx(gx)+'" y2="'+(H-B)+'" stroke="#1d2a40"/><text x="'+sx(gx)+'" y="'+(H-B+22)+'" fill="#8292ad" font-size="12" text-anchor="middle">'+gx+'</text>'}
for(let gy=-2;gy<=2;gy++)s+='<line x1="'+L+'" y1="'+sy(gy)+'" x2="'+(W-R)+'" y2="'+sy(gy)+'" stroke="#1d2a40"/><text x="'+(L-12)+'" y="'+(sy(gy)+4)+'" fill="#8292ad" font-size="12" text-anchor="end">'+gy+'</text>';
s+='<line x1="'+L+'" y1="'+sy(0)+'" x2="'+(W-R)+'" y2="'+sy(0)+'" stroke="#71819a" stroke-width="1.5"/><line x1="'+sx(0)+'" y1="'+T+'" x2="'+sx(0)+'" y2="'+(H-B)+'" stroke="#71819a" stroke-width="1.5"/>';
if(mode==='int'){let a=0,b=x,dx=(b-a)/n;for(let i=0;i<n;i++){let x0=a+i*dx,x1=x0+dx,yy=f.f(x0);s+='<rect x="'+Math.min(sx(x0),sx(x1))+'" y="'+Math.min(sy(yy),sy(0))+'" width="'+Math.abs(sx(x1)-sx(x0))+'" height="'+Math.abs(sy(yy)-sy(0))+'" fill="#63e0d1" opacity=".22" stroke="#63e0d1" stroke-width=".6"/>'}}
s+='<path d="'+pathFor(f.f)+'" fill="none" stroke="#76a9ff" stroke-width="3" stroke-linecap="round"/>';
if(mode==='diff'&&Number.isFinite(d)){let h=.8;s+=line(x-h,y-d*h,x+h,y+d*h,'#ffb86b',2,'7 5')+line(x,y,x,0,'#ffb86b',1,'3 4')}
if(mode==='limit')s+='<circle cx="'+sx(x)+'" cy="'+sy(y)+'" r="6" fill="#ffb86b" stroke="#fff" stroke-width="2"/>';
s+='<text x="'+(W-28)+'" y="'+(H-13)+'" fill="#9aaac2" font-size="13">x</text><text x="'+(L+10)+'" y="'+(T+12)+'" fill="#9aaac2" font-size="13">y</text>';svg.innerHTML=s;
$('#sliderLabel').textContent='x = '+x.toFixed(2);$('#nlabel').textContent=n+'개';
let cards=mode==='limit'?[['현재 함수값',fmt(y)],['가까워지는 값',fmt(y)]]:mode==='diff'?[['현재 함수값',fmt(y)],['접선의 기울기',fmt(d)]]:[['구간','[0, '+x.toFixed(2)+']'],['넓이의 근삿값',fmt(riemann(f.f,0,x,n))]];
$('#metrics').innerHTML=cards.map(c=>'<div class="metric"><small>'+c[0]+'</small><strong>'+c[1]+'</strong></div>').join('')}
const content={limit:{title:'극한은 무엇일까?',head:'입력값이 어떤 수에 <strong>한없이 가까워질 때</strong>, 함수값이 어디로 향하는지 보는 개념이야.',formula:'limₓ→ₐ f(x) = L',steps:['주황색 점은 현재 x에서의 함수값을 나타내.','x를 조금씩 움직이면서 y값이 어디로 향하는지 관찰해.','극한은 그 점에서의 실제 함수값과 달라도 될 수 있어.']},diff:{title:'미분은 순간 변화율',head:'두 점을 잇는 직선의 기울기에서 출발해. 두 점 사이의 간격을 0에 가깝게 줄이면 <strong>접선의 기울기</strong>에 가까워져.',formula:'f′(x) = limₕ→₀ [f(x+h)−f(x)] / h',steps:['x 위치를 선택해.','주황색 점선은 그 위치에서의 접선을 보여줘.','x에 따라 접선의 기울기가 어떻게 변하는지 확인해. |x|의 꼭짓점에서는 미분계수가 존재하지 않아.']},int:{title:'적분은 작은 넓이의 합',head:'구간을 잘게 나누고 직사각형 넓이를 더하면 곡선 아래 넓이에 가까워져. 분할 수를 늘려 보자.',formula:'∫₀ˣ f(t) dt',steps:['0부터 선택한 x까지를 직사각형으로 나눠.','각 직사각형의 넓이를 모두 더해.','분할 개수가 커질수록 근삿값이 정교해져. x가 음수면 방향에 따라 부호가 바뀌어.']}};
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));let c=content[m];$('#graphTitle').textContent=m==='limit'?'가까워지는 값 관찰하기':m==='diff'?'접선의 기울기 관찰하기':'직사각형으로 넓이 쌓기';$('#sideTitle').textContent=c.title;$('#explain').innerHTML=c.head+'<p class="formula">'+c.formula+'</p>';$('#steps').innerHTML=c.steps.map(t=>'<div class="step">'+t+'</div>').join('');$('#extraControls').style.display=m==='int'?'flex':'none';draw()}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('#func').addEventListener('change',draw);$('#xval').addEventListener('input',draw);$('#nval').addEventListener('input',draw);setMode('limit');
</script></body></html>
